name: Build & Release APK

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > keystore.jks

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Rename APK to versioned name
        run: |
          TAG_NAME=${GITHUB_REF_NAME#v}

          APK_PATH=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          APK_NAME=JitsiVideoChat-v$TAG_NAME.apk

          cp "$APK_PATH" "$APK_NAME"

          echo "APK renamed to $APK_NAME"

      - name: Publish APK to jitsi-release
        run: |
          TAG_NAME=${GITHUB_REF_NAME#v}
          APK_NAME=JitsiVideoChat-v$TAG_NAME.apk

          git clone https://x-access-token:${{ secrets.UPDATE_REPO_TOKEN }}@github.com/sSergey8/jitsi-release.git
          cd jitsi-release

          gh release create v$TAG_NAME ../$APK_NAME \
            --title "Release v$TAG_NAME" \
            --notes "Auto release v$TAG_NAME" || \
          gh release upload v$TAG_NAME ../$APK_NAME --clobber
        env:
          GH_TOKEN: ${{ secrets.UPDATE_REPO_TOKEN }}

      - name: Update version.json in jitsi-update
        run: |
          TAG_NAME=${GITHUB_REF_NAME#v}

          cat > version.json <<EOF
          {
            "versionCode": $(echo "$TAG_NAME" | awk -F. '{print $3}'),
            "versionName": "$TAG_NAME",
            "apkUrl": "https://github.com/sSergey8/jitsi-release/releases/download/v$TAG_NAME/JitsiVideoChat-v$TAG_NAME.apk"
          }
          EOF

          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git clone https://x-access-token:${{ secrets.UPDATE_REPO_TOKEN }}@github.com/sSergey8/jitsi-update.git
          cd jitsi-update

          mv ../version.json .
          git add version.json
          git commit -m "Update version to v$TAG_NAME"
          git push
